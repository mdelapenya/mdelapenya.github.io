baseURL = "https://mdelapenya.xyz"
defaultContentLanguage = "en"
enableEmoji = true
enableRobotsTXT = true
locale = "en"
# Choose one of emacs, trac or perldoc
pygmentsStyle = "monokai"
theme = "gokarna"
title = "Manuel de la Peña"
timeout = "120s"

[outputs]
  home = ["HTML", "RSS", "JSON", "LangMap"]

[pagination]
  pagerSize = 15
  path = "page"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params]
  avatarAltText = "avatar"
  avatarSize = "size-m"
  avatarURL = "/images/profile.jpeg"

  customHeadHTML = """
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <!-- KaTeX -->
    <link rel="stylesheet" href="/css/images.css">
    <link rel="stylesheet" href="/css/image-gallery.css">
    <link rel="stylesheet" href="/css/pagination.css">
    <link rel="stylesheet" href="/css/breadcrumb.css">
    <link rel="stylesheet" href="/css/tag-cloud.css">
    <link rel="stylesheet" href="/css/taxonomy.css">
    <link rel="stylesheet" href="/css/search.css">
    <link rel="stylesheet" href="/css/post-authorship.css">
    <link rel="stylesheet" href="/css/subscribe.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <link rel="stylesheet" href="/css/related-posts.css">
    <link rel="stylesheet" href="/css/talks.css">
    <link rel="stylesheet" href="/css/i18n.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css" integrity="sha384-Xi8rHCmBmhbuyyhbI88391ZKP2dmfnOl4rT9ZfRI7mLTdk1wblIUnrIq35nqwEvC" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js" integrity="sha384-X/XCfMm41VSsqRNQgDerQczD69XqmjOOOwYQvr/uuC+j4OPoNhVgjdGFwhvN02Ja" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/contrib/auto-render.min.js" integrity="sha384-+XBljXPPiv+OzfbB3cVmLHf4hdUFHlWNZN5spNQ7rmHTXpd7WvJum6fIACpNNfIR" crossorigin="anonymous"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        renderMathInElement(document.body, {
          // customised options
          // • auto-render specific keys, e.g.:
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
          ],
          // • rendering keys, e.g.:
          throwOnError : false
        });
      });
    </script>
  """

  customFooterHTML = """
    <script src="/js/image-gallery.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
    <script src="/js/search.js"></script>
    <script src="/js/subscribe.js"></script>
  """

  # Cloudflare Turnstile site key for subscribe form
  # Create at: https://dash.cloudflare.com/?to=/:account/turnstile
  turnstileSiteKey = "0x4AAAAAACqj5xGJtBnVRTvg"

  description = "OSS Software Engineer"
  footer = "@mdelapenya"
  metaKeywords = ["blog", "gokarna", "hugo"]
  showBackToTopButton = true # true or false for "back to top" button on posts and pages

  socialIcons = [
    {name = "github", url = "https://github.com/mdelapenya"},
    {name = "linkedin", url = "https://linkedin.com/in/mdelapenya"},
    {name = "twitter", url = "https://twitter.com/@mdelapenya"},
    {name = "mastodon", url = "https://hachyderm.io/@mdelapenya"},
    {name = "sessionize", url = "https://sessionize.com/mdelapenya"},
    {name = "stackoverflow", url = "https://stackoverflow.com/users/2382761/mdelapenya"},
    {name = "instagram", url = "https://instagram.com/mdelapenya"},
  ]

# Notice shown when a page has no translation in the reader's language.
# Keyed by the language the page is written in, then by the reader's language.
[params.untranslated]
  [params.untranslated.en]
    es = "Este post solo está disponible en inglés."
  [params.untranslated.es]
    en = "This post is only available in Spanish."

[outputFormats]
  [outputFormats.LangMap]
    mediaType = "application/json"
    baseName = "langmap"
    isPlainText = true
    notAlternative = true

# English is the default language and stays at the root, so no existing URL
# changes. Spanish lives under /es/. Posts are paired across languages with
# a shared `translationKey` in their front matter.
[languages]
  [languages.en]
    weight = 1
    label = "English"
    locale = "en"
    title = "Manuel de la Peña"

    [languages.en.params]
      description = "OSS Software Engineer"
      dateFormat = "January 2, 2006"

    [[languages.en.menus.main]]
      name = "Home"
      pre = "<span data-feather='home'></span>"
      url = "/"
      weight = 1

    [[languages.en.menus.main]]
      name = "Posts"
      pre = "<span data-feather='book'></span>"
      url = "/posts/"
      weight = 2

    [[languages.en.menus.main]]
      name = "Projects"
      pre = "<span data-feather='code'></span>"
      url = "/projects/"
      weight = 3

    [[languages.en.menus.main]]
      name = "Public Speaking"
      pre = "<span data-feather='mic'></span>"
      url = "/talks/"
      weight = 4

    [[languages.en.menus.main]]
      name = "Tags"
      pre = "<span data-feather='tag'></span>"
      url = "/tags/"
      weight = 5

    [[languages.en.menus.main]]
      identifier = "github"
      pre = "<span data-feather='github'></span>"
      url = "https://github.com/mdelapenya/mdelapenya.github.io"
      weight = 6

    [[languages.en.menus.main]]
      identifier = "sponsors"
      pre = "<span data-feather='heart'></span>"
      url = "https://github.com/sponsors/mdelapenya"
      weight = 7

    [[languages.en.menus.main]]
      identifier = "subscribe"
      pre = "<span data-feather='mail'></span>"
      url = "/subscribe/"
      weight = 8

    [[languages.en.menus.main]]
      identifier = "rss"
      pre = "<span data-feather='rss'></span>"
      url = "/index.xml"
      weight = 9

  [languages.es]
    weight = 2
    label = "Español"
    locale = "es"
    title = "Manuel de la Peña"

    [languages.es.params]
      description = "Ingeniero de software OSS"
      dateFormat = ":date_long"

    [[languages.es.menus.main]]
      name = "Inicio"
      pre = "<span data-feather='home'></span>"
      url = "/es/"
      weight = 1

    [[languages.es.menus.main]]
      name = "Posts"
      pre = "<span data-feather='book'></span>"
      url = "/es/posts/"
      weight = 2

    [[languages.es.menus.main]]
      name = "Proyectos"
      pre = "<span data-feather='code'></span>"
      url = "/es/projects/"
      weight = 3

    [[languages.es.menus.main]]
      name = "Charlas"
      pre = "<span data-feather='mic'></span>"
      url = "/es/talks/"
      weight = 4

    [[languages.es.menus.main]]
      name = "Etiquetas"
      pre = "<span data-feather='tag'></span>"
      url = "/es/tags/"
      weight = 5

    [[languages.es.menus.main]]
      identifier = "github"
      pre = "<span data-feather='github'></span>"
      url = "https://github.com/mdelapenya/mdelapenya.github.io"
      weight = 6

    [[languages.es.menus.main]]
      identifier = "sponsors"
      pre = "<span data-feather='heart'></span>"
      url = "https://github.com/sponsors/mdelapenya"
      weight = 7

    [[languages.es.menus.main]]
      identifier = "subscribe"
      pre = "<span data-feather='mail'></span>"
      url = "/es/subscribe/"
      weight = 8

    [[languages.es.menus.main]]
      identifier = "rss"
      pre = "<span data-feather='rss'></span>"
      url = "/es/index.xml"
      weight = 9

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 4
    ordered = false

[minify]
    minifyOutput = true

[imaging]
  anchor = "Smart"
  resampleFilter = "Lanczos"

  [imaging.jpeg]
    quality = 75

  [imaging.webp]
    quality = 75
